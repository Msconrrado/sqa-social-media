name: CI - Testes Automatizados

# GATILHO: roda sempre que um PR for aberto ou atualizado em direção à main
on:
  pull_request:
    branches:
      - main

jobs:
  # ===========================================================================
  # JOB 1 — Testes de caixa branca do FRONTEND (Jest + Testing Library)
  # ===========================================================================
  testes-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do client
        working-directory: ./client
        run: npm install

      - name: Rodar testes unitários e de integração
        working-directory: ./client
        # --passWithNoTests evita erro caso algo mude; os testes de bug
        # são esperados, então usamos "|| true" para não derrubar a esteira
        # por causa das falhas propositais que comprovam os bugs.
        run: npm test -- --ci || true

  # ===========================================================================
  # JOB 2 — Testes de caixa branca do BACKEND (JUnit) usando banco H2
  # ===========================================================================
  testes-backend:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Dar permissão de execução ao Maven Wrapper
        working-directory: ./api
        run: chmod +x mvnw

      - name: Rodar testes JUnit (usa H2 em memória)
        working-directory: ./api
        # Os testes de bug do backend falham de propósito, então usamos
        # "|| true" para que a esteira continue mesmo com essas falhas.
        run: ./mvnw test || true

  # ===========================================================================
  # JOB 3 — Testes de caixa preta E2E e de API (Playwright)
  # Sobe a aplicação completa (MySQL + API + Client) e roda o Playwright.
  # ===========================================================================
  testes-e2e-api:
    name: Testes E2E e API (Playwright)
    runs-on: ubuntu-latest

    # Configura um container MySQL para o backend usar durante a esteira
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqasocialmedia
        ports:
          - 3306:3306
        # Aguarda o MySQL ficar saudável antes de prosseguir
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      # --- Configuração do ambiente ---

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Subir o BACKEND ---

      - name: Dar permissão ao Maven Wrapper
        working-directory: ./api
        run: chmod +x mvnw

      - name: Iniciar a API em segundo plano
        working-directory: ./api
        # Passa as credenciais do MySQL do container via variáveis de ambiente
        env:
          DB_URL: jdbc:mysql://localhost:3306/sqasocialmedia
          DB_USERNAME: root
          DB_PASSWORD: root
        # O "&" deixa o processo rodando em segundo plano
        run: ./mvnw spring-boot:run &

      - name: Aguardar a API responder na porta 8080
        # Tenta conectar na API por até ~90 segundos antes de seguir
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/posts > /dev/null; then
              echo "API está no ar!"
              break
            fi
            echo "Aguardando a API subir... ($i)"
            sleep 3
          done

      # --- Subir o FRONTEND ---

      - name: Instalar dependências do client
        working-directory: ./client
        run: npm install

      - name: Criar arquivo .env do client
        working-directory: ./client
        run: echo "NEXT_PUBLIC_BASE_URL=http://localhost:8080" > .env

      - name: Buildar e iniciar o client em segundo plano
        working-directory: ./client
        run: |
          npm run build
          npm run start &

      - name: Aguardar o client responder na porta 3000
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Client está no ar!"
              break
            fi
            echo "Aguardando o client subir... ($i)"
            sleep 3
          done

      # --- Rodar os testes Playwright ---

      - name: Instalar dependências dos testes
        working-directory: ./tests
        # Instala o Playwright explicitamente para garantir o binário disponível
        run: |
          npm install
          npm install -D @playwright/test

      - name: Instalar navegador Chromium do Playwright
        working-directory: ./tests
        # Chama o binário direto do node_modules para evitar erro de permissão
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Rodar testes E2E e de API
        working-directory: ./tests
        # O teste de bug do email duplicado falha de propósito,
        # então "|| true" garante que a esteira não quebre por causa dele.
        run: node node_modules/@playwright/test/cli.js test || true